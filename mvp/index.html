<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ハツミル - 相性で出会う</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0F1A;
    --bg-soft: #10162A;
    --glass: rgba(255,255,255,0.055);
    --glass-strong: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.11);
    --aqua: #6EE7D8;
    --aqua-dim: rgba(110,231,216,0.35);
    --coral: #FF93A8;
    --coral-dim: rgba(255,147,168,0.35);
    --text: #F2F5FA;
    --muted: #8B96AC;
    --muted-dim: #5B647A;
  }
*{box-sizing:border-box; margin:0; padding:0;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:
      radial-gradient(ellipse 800px 500px at 20% -10%, rgba(110,231,216,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 10%, rgba(255,147,168,0.07), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .head-font{ font-family: 'Zen Kaku Gothic New', sans-serif; }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  .app-shell{
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 84px;
    position: relative;
  }
  @media (min-width: 900px){
    .app-shell{ max-width: 1200px; padding-bottom: 40px; }
  }
  .statusbar{ height:0; }

  header.top{
    padding: 18px 20px 6px;
    display:flex; align-items:flex-start; justify-content:space-between;
    position: sticky; top: 0; z-index: 30;
    background: rgba(11,15,26,0.85); backdrop-filter: blur(10px);
  }
  @media (min-width: 900px){
    header.top{ padding: 18px 32px; align-items:center; }
  }
  .logo{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900; font-size:20px; letter-spacing:0.02em;
    background: linear-gradient(90deg, var(--aqua), var(--coral));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tagline{
    font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 0.01em;
  }
  .cp-badge{
    font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;
    background:var(--glass); border:1px solid var(--border); padding:6px 10px; border-radius:100px;
  }
  .cp-badge b{ color:var(--text); font-family:'JetBrains Mono',monospace; font-weight:500; }

  main{ padding: 4px 20px 40px; }
  @media (min-width: 900px){
    main{ padding: 24px 32px 60px; max-width: 1200px; margin: 0 auto; }
  }

  .section-label{
    font-size:11px; letter-spacing:0.14em; color: var(--muted-dim);
    text-transform:uppercase; margin: 22px 0 10px 2px; font-weight:600;
  }
  .section-title{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:17px;
    margin-bottom:2px; display:flex; align-items:center; gap:8px;
  }
  .section-sub{ font-size:12px; color:var(--muted); margin-bottom:12px; }

/* ------- トップのヒーローセクション ------- */
  .hero-section{
    padding: 22px 2px 8px;
    text-align: center;
  }
  .hero-brand{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900; font-size:15px;
    color: var(--muted); letter-spacing:0.06em; margin-bottom:14px;
  }
  .hero-copy{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900;
    font-size: clamp(26px, 7vw, 32px); line-height:1.4; margin-bottom:14px;
  }
  .hero-copy .accent{
    background: linear-gradient(90deg, var(--aqua), var(--coral));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-desc{
    font-size: 13px; color: var(--muted); line-height:1.7; margin: 0 auto 22px;
    max-width: 340px;
  }
  .hero-actions{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .hero-btn-primary{
    width:100%; padding: 15px 0; border-radius:100px; border:none;
    background: linear-gradient(90deg, var(--aqua), var(--coral));
    color:#0B0F1A; font-weight:700; font-size:14.5px; cursor:pointer;
    box-shadow: 0 10px 26px rgba(110,231,216,0.16);
  }
  .hero-btn-secondary{
    width:100%; padding: 13px 0; border-radius:100px; border:1px solid var(--border);
    background: transparent; color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .hero-creator-link{
    font-size:12px; color:var(--muted); text-decoration:underline; text-underline-offset:3px;
    background:none; border:none; cursor:pointer; font-family:inherit;
  }

  /* ------- 相性診断 ------- */
  .diag-progress{ display:flex; align-items:center; gap:12px; margin: 10px 0 28px; }
  .diag-back{
    background:transparent; border:1px solid var(--border); color:var(--text);
    width:36px; height:36px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .diag-progress-bar{ flex:1; height:6px; background:var(--glass); border-radius:100px; overflow:hidden; }
  .diag-progress-fill{ height:100%; background:linear-gradient(90deg,var(--aqua),var(--coral)); border-radius:100px; transition:width .3s; }
  .diag-progress-text{ font-size:12px; color:var(--muted); font-family:'JetBrains Mono',monospace; flex-shrink:0; }
  .diag-question{
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:20px;
    line-height:1.5; margin: 0 0 26px; text-align:center;
  }
  .diag-options{ display:flex; flex-direction:column; gap:10px; }
  .diag-option{
    width:100%; padding:16px 20px; border-radius:16px; border:1px solid var(--border);
    background:var(--glass); color:var(--text); font-size:14.5px; font-weight:600;
    text-align:left; cursor:pointer; transition:.15s;
  }
  .diag-option:hover{ border-color:var(--aqua-dim); background:rgba(110,231,216,0.08); }
  .diag-option:focus-visible{ outline:2px solid var(--aqua); outline-offset:2px; }

  .result-card{
    background:var(--glass); border:1px solid var(--border); border-radius:18px;
    padding:16px; margin-bottom:14px;
  }
  .result-head{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .result-head .name{ font-weight:700; font-size:15px; }
  .result-head .genre{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .match-score{
    margin-left:auto; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px;
    color:var(--aqua); flex-shrink:0;
  }
  .reason-list{ list-style:none; margin:0 0 12px; padding:0; }
  .reason-list li{
    font-size:12.5px; color:var(--muted); line-height:1.7; padding-left:16px; position:relative;
  }
  .reason-list li::before{ content:"・"; position:absolute; left:0; color:var(--coral); }
  .result-actions{ display:flex; gap:8px; }
  .result-actions .go-btn{ flex:1; margin-top:0; }
  .result-actions .save-btn{ flex:1; }

  .pref-summary{
    background:var(--glass); border:1px solid var(--border); border-radius:16px;
    padding:14px 16px; margin: 4px 0 18px;
  }
  .pref-summary-title{ font-weight:700; font-size:13.5px; margin-bottom:8px; }
  .pref-summary ul{ list-style:none; margin:0; padding:0; }
  .pref-summary li{
    font-size:12.5px; color:var(--muted); line-height:1.8; padding-left:16px; position:relative;
  }
  .pref-summary li::before{ content:"・"; position:absolute; left:0; color:var(--aqua); }

  .result-card-top{
    border: 1px solid var(--aqua-dim);
    background: linear-gradient(160deg, rgba(110,231,216,0.08), var(--glass));
  }
  .result-rank{
    display:inline-block; font-size:11px; font-weight:700; color:#0B0F1A;
    background: linear-gradient(90deg, var(--aqua), var(--coral));
    padding:4px 10px; border-radius:100px; margin-bottom:10px;
  }
  @media (min-width: 900px){
    .hero-br{ display:none; }
    .hero-section{
      display:flex; align-items:center; justify-content:space-between; gap:48px;
      text-align:left; padding: 40px 2px 30px;
    }
    .hero-copy-col{ flex:1; max-width:560px; }
    .hero-brand{ margin-bottom:18px; }
    .hero-desc{ margin:0 0 26px; max-width:460px; }
    .hero-actions{ flex-direction:row; max-width:480px; }
    .hero-visual-col{
      flex:1; max-width:380px; display:flex; align-items:center; justify-content:center;
    }
  }

    .hero-title{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900; font-size:21px;
    display:flex; align-items:center; gap:9px; margin-bottom:2px;
    background: linear-gradient(90deg, var(--text), var(--coral) 120%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .pulse-dot{
    width:9px; height:9px; border-radius:100%; background: var(--coral); flex-shrink:0;
    box-shadow: 0 0 0 0 rgba(255,147,168,0.6);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(255,147,168,0.55); }
    70%{ box-shadow: 0 0 0 8px rgba(255,147,168,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,147,168,0); }
  }
  .milestone-card.featured{
    min-width: 230px; max-width:230px;
    border-color: rgba(255,147,168,0.4);
    background: linear-gradient(160deg, rgba(255,147,168,0.10), var(--glass));
  }

  /* 今日のはじめて フィード */
  .milestone-scroll{
    display:flex; gap:12px; overflow-x:auto; padding: 4px 0 10px; scrollbar-width:none;
    margin: 0 -20px; padding-left:20px; padding-right:20px;
  }
  .milestone-scroll::-webkit-scrollbar{ display:none; }
  .milestone-card{
    min-width: 200px; max-width:200px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    backdrop-filter: blur(14px);
    flex-shrink:0;
    position:relative;
  }
  .milestone-tag{
    display:inline-block; font-size:10px; padding:3px 8px; border-radius:100px;
    background: var(--coral-dim); color:#FFD7DF; margin-bottom:9px; font-weight:600;
  }
  .milestone-card .name{ font-weight:700; font-size:13.5px; margin-bottom:3px; }
  .milestone-card .desc{ font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:10px; min-height:34px; }
  .cheer-row{ display:flex; flex-wrap:wrap; gap:5px; }
  .cheer-btn{
    font-size:11px; padding:5px 8px; border-radius:100px; border:1px solid var(--border);
    background: rgba(255,255,255,0.03); color: var(--text); cursor:pointer;
    transition: all .15s ease; white-space:nowrap;
  }
  .cheer-btn:hover{ background: var(--coral-dim); border-color: var(--coral); transform: translateY(-1px); }
  .cheer-btn.sent{ background: var(--coral-dim); border-color: var(--coral); opacity:0.7; pointer-events:none; }
  .cheer-count{ font-size:10.5px; color:var(--muted-dim); margin-top:6px; font-family:'JetBrains Mono',monospace; }

  /* 検索 */
  .search-bar{
    display:flex; align-items:center; gap:8px;
    background: var(--glass); border:1px solid var(--border); border-radius:14px;
    padding: 12px 14px; margin-bottom:12px;
  }
  .search-bar input{
    background:none; border:none; outline:none; color:var(--text); font-size:14px; width:100%;
    font-family:'Noto Sans JP',sans-serif;
  }
  .search-bar input::placeholder{ color: var(--muted-dim); }
  .filter-row{ display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; scrollbar-width:none; }
  .rsvp-card{
    background:var(--glass); border:1px solid var(--border); border-radius:18px;
    padding:16px; margin-bottom:14px;
  }
  .rsvp-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .rsvp-head .name{ font-weight:700; font-size:14px; }
  .rsvp-head .meta{ font-size:11px; color:var(--coral); font-family:'JetBrains Mono',monospace; }
  .rsvp-desc{ font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:14px; }
  .rsvp-row{ display:flex; gap:6px; }
  .rsvp-btn{
    flex:1; padding:10px 0; border-radius:100px; font-size:11px; font-weight:700;
    border:1px solid var(--border); background:transparent; color:var(--text);
    cursor:pointer;
  }
  .rsvp-btn.going{ background:linear-gradient(90deg,var(--aqua),var(--coral)); color:#0B0F1A; border:none; }
  .rsvp-btn.going.selected{ background:rgba(110,231,216,0.16); color:var(--aqua); border:2px solid var(--aqua); }
  .rsvp-btn.maybe.selected{ border-color:var(--coral-dim); color:var(--coral); }
  .rsvp-btn.interested.selected{ border-color:var(--aqua-dim); color:var(--aqua); }
  .rsvp-counts{ margin-top:9px; font-size:10.5px; color:var(--muted); }
  .filter-row::-webkit-scrollbar{ display:none; }
  .chip{
    font-size:12px; padding:7px 13px; border-radius:100px; border:1px solid var(--border);
    background: rgba(255,255,255,0.03); white-space:nowrap; cursor:pointer; color:var(--muted); transition:.15s;
  }
  .chip.active{ background: var(--aqua-dim); border-color: var(--aqua); color:#DFFFFA; }

  /* 活動者カード */
.creator-card{
    background: var(--glass); border:1px solid var(--border); border-radius:18px;
    padding: 12px; margin-bottom:10px; display:flex; gap:12px; cursor:pointer; transition:.15s;
    position:relative;
  }
  .creator-card:hover{ border-color: var(--aqua-dim); }
  .creator-grid{ display:block; }
  @media (min-width: 900px){
    .creator-grid{
      display:grid; grid-template-columns: repeat(3, 1fr); gap:14px;
    }
    .creator-grid .creator-card{ margin-bottom:0; flex-direction:column; text-align:left; padding:0; overflow:hidden; }
    .creator-grid .creator-info{ width:100%; padding:12px 14px 14px; }
    .creator-grid .card-image{ width:100%; height:200px; border-radius:0; font-size:52px; }
  }
  .card-image{
    width:104px; height:104px; border-radius:16px; flex-shrink:0;
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:900;
    color: rgba(10,14,24,0.85);
    font-family:'Zen Kaku Gothic New', sans-serif;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .card-oki-btn{
    position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
    background:rgba(10,14,24,0.55); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.18);
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .avatar{
    width:52px; height:52px; border-radius:100%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700;
    color: rgba(10,14,24,0.85);
    font-family:'Zen Kaku Gothic New', sans-serif;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .creator-info{ flex:1; min-width:0; }
  .creator-info .name{ font-weight:700; font-size:14.5px; }
  .creator-info .genre{ font-size:11.5px; color:var(--muted); margin: 2px 0 6px; }
  .phase-badge{
    display:inline-block; font-size:10px; padding:2px 8px; border-radius:100px;
    background: rgba(110,231,216,0.14); color: var(--aqua); font-weight:600; margin-right:6px;
  }
  .reason-line{
    font-size:11px; color: #FFD7DF; margin-top:6px; display:flex; align-items:center; gap:4px;
  }

  /* プロフィール(モーダル) */
.modal-overlay{
    position:fixed; inset:0; background: rgba(6,8,14,0.72); backdrop-filter: blur(4px);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto; background: var(--bg-soft);
    border-radius: 26px 26px 0 0; border: 1px solid var(--border); border-bottom:none;
    padding: 10px 20px 40px; animation: slideup .25s ease;
    scrollbar-width:none;
  }
  .modal::-webkit-scrollbar{ display:none; }
  @keyframes slideup{ from{ transform: translateY(30px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
  .modal-handle{ width:36px; height:4px; background: var(--border); border-radius:100px; margin: 8px auto 16px; }
  .modal-close{
    position:absolute; top:14px; right:20px; width:30px; height:30px; border-radius:100px;
    background: var(--glass); border:1px solid var(--border); color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
  }
  .profile-header{ display:flex; gap:14px; align-items:center; margin-bottom:6px; }
  .profile-header .avatar{ width:64px; height:64px; font-size:26px; }
  .profile-header .name{ font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:19px; }
  .profile-header .genre{ font-size:12.5px; color:var(--muted); margin-top:3px; }

  .growth-line{
    font-size: 11.5px; color: var(--aqua); margin-top: 8px; font-family:'JetBrains Mono',monospace;
  }
.reason-box{
    margin: 14px 0; padding: 12px 14px; border-radius:14px;
    background: linear-gradient(120deg, rgba(255,147,168,0.10), rgba(110,231,216,0.08));
    border: 1px solid rgba(255,147,168,0.25);
    font-size:12.5px; color:#FFE3E9; display:flex; flex-direction:column; gap:6px;
  }
  .profile-match{
    display:flex; align-items:baseline; gap:8px; margin: 10px 0 4px;
  }
  .profile-match-score{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:32px; color:var(--aqua);
  }
  .profile-match-label{ font-size:12px; color:var(--muted); }
  .info-row{ display:flex; gap:8px; margin: 14px 0; flex-wrap:wrap; }
  .info-item{
    flex:1; min-width:90px; background:var(--glass); border:1px solid var(--border);
    border-radius:12px; padding:8px 10px;
  }
  .info-label{ display:block; font-size:10px; color:var(--muted); margin-bottom:2px; }
  .info-value{ display:block; font-size:13px; font-weight:700; }

  .radar-wrap{
    display:flex; justify-content:center; margin: 14px 0 6px;
    background: radial-gradient(ellipse at center, rgba(110,231,216,0.06), transparent 70%);
    border-radius: 20px; padding: 10px 0;
  }

  .radar-common-wrap{
    width:100%; max-width:310px; margin:0 auto;
    background: radial-gradient(ellipse at center, rgba(110,231,216,0.08), transparent 70%);
    border-radius: 20px; padding: 14px 0;
  }
  @media (min-width: 900px){
    .radar-common-wrap{ max-width:420px; }
  }
  .radar-legend{
    list-style:none; margin:14px 0 6px; padding:0;
    display:grid; grid-template-columns: 1fr; gap:8px;
  }
  .radar-legend li{
    display:flex; flex-direction:column; gap:2px;
    padding:8px 12px; background:var(--glass); border:1px solid var(--border); border-radius:12px;
  }
  .radar-legend-label{ font-size:12.5px; font-weight:700; color:var(--text); }
  .radar-legend-range{ font-size:10.5px; color:var(--muted); }

  .bio{ font-size:13px; color:var(--muted); line-height:1.7; margin: 6px 0 4px; }

  .timeline{ margin-top: 6px; }
  .tl-item{
    display:flex; gap:12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tl-dot{
    width:8px; height:8px; border-radius:100px; background: var(--coral); margin-top:6px; flex-shrink:0;
    box-shadow: 0 0 8px var(--coral);
  }
  .tl-content .tl-title{ font-weight:700; font-size:13.5px; }
  .tl-content .tl-date{ font-size:10.5px; color:var(--muted-dim); font-family:'JetBrains Mono',monospace; margin-bottom:4px; }
  .tl-content .tl-desc{ font-size:12.5px; color:var(--muted); margin-bottom:8px; }

  .go-btn{
    display:flex; flex-direction:column; align-items:center; gap:2px; width:100%; margin-top: 22px;
    padding: 20px; border-radius: 24px; border:none; cursor:pointer;
    background: linear-gradient(120deg, var(--aqua) 0%, var(--coral) 100%);
    box-shadow: 0 8px 30px rgba(110,231,216,0.28);
    color:#0A1420; font-weight:900; font-size:16px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    transition: transform .15s ease;
  }
  .go-btn:active{ transform: scale(0.98); }
  .go-btn .go-sub{ font-size:11px; font-weight:500; opacity:0.75; }
  .save-btn{
    display:block; width:100%; text-align:center; margin-top: 10px;
    padding: 13px; border-radius: 100px; cursor:pointer;
    background: transparent; color: var(--muted); font-size:13px; border:1px solid var(--border);
  }

  /* ボトムナビ */
nav.bottom{
    position:fixed; bottom:0; left:0; right:0;
    max-width: 480px; margin: 0 auto;
    background: rgba(13,18,32,0.9); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display:flex; padding: 10px 24px 18px;

function hueFromName(name){
  let h = 0;
  for (let i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) % 360; }
  return h;
}
function cardImageHtml(c){
  if (c.avatar_url){
    return `<div class="card-image" style="background-image:url('${c.avatar_url}');"></div>`;
  }
  const hue = hueFromName(c.name);
  const bg = `linear-gradient(135deg, hsl(${hue},70%,68%), hsl(${(hue+70)%360},70%,62%))`;
  return `<div class="card-image" style="background:${bg};">${c.name.charAt(0)}</div>`;
}
function avatarHtml(c, size){
  if (c.avatar_url){
    return `<div class="avatar" style="width:${size}px;height:${size}px;background-image:url('${c.avatar_url}');background-size:cover;background-position:center;"></div>`;
  }
  const hue = hueFromName(c.name);
  const bg = `linear-gradient(135deg, hsl(${hue},70%,68%), hsl(${(hue+70)%360},70%,62%))`;
  const fontSize = Math.round(size*0.36);
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${fontSize}px;background:${bg}">${c.name.charAt(0)}</div>`;
}

const NOW = new Date('2026-07-28');
function daysSince(dateStr){
  const d = Math.round((NOW - new Date(dateStr)) / 86400000);
  return d;
}
function growthLine(creator){
  if (!creator.milestones.length) return null;
  const sorted = [...creator.milestones].sort((a,b)=> new Date(a.date) - new Date(b.date));
  const firstDays = daysSince(sorted[0].date);
  const count = creator.milestones.length;
  return `🌱 はじめてから${firstDays}日 ・ 🎉 挑戦の記録 ${count}件`;
}

}

// ------- レーダーチャート描画（軸数が可変） -------
function renderRadar(axesObj){
  const axes = Object.keys(axesObj);
  const values = Object.values(axesObj);
  const n = axes.length;
      const pad = 40; // ラベルがはみ出さない・データ点と重ならないための余白
    const size = 220, cx = (size + pad*2)/2, cy = (size + pad*2)/2, r = 78, maxVal = 5;

  function point(i, val){
    const angle = (Math.PI * 2 * i / n) - Math.PI/2;
    const dist = (val/maxVal) * r;
    return [cx + Math.cos(angle)*dist, cy + Math.sin(angle)*dist];
  }
  function gridPoint(i, dist){
    const angle = (Math.PI * 2 * i / n) - Math.PI/2;
    return [cx + Math.cos(angle)*dist, cy + Math.sin(angle)*dist];
  }

  let grids = "";
  [0.33,0.66,1].forEach(f=>{
    const pts = axes.map((_,i)=> gridPoint(i, r*f).join(',')).join(' ');
    grids += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
  });
  const svgSize = size + pad*2;
  let spokes = "";
  axes.forEach((_,i)=>{
    const [x,y] = gridPoint(i, r);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
  });

  const dataPts = axes.map((a,i)=> point(i, axesObj[a]).join(',')).join(' ');

  let dots = "";
  let labels = "";
  axes.forEach((a,i)=>{
    const [px,py] = point(i, axesObj[a]);
    dots += `<circle cx="${px}" cy="${py}" r="3.5" fill="#6EE7D8" style="filter:drop-shadow(0 0 4px #6EE7D8)"/>`;
        const [lx,ly] = gridPoint(i, r+30);
    labels += `<text x="${lx}" y="${ly}" fill="#F2F5FA" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="Noto Sans JP">${a.label}</text>`;
  });

  return `
    <svg width="${svgSize}" height="${svgSize}" viewBox="0 0 ${svgSize} ${svgSize}" style="overflow:visible">
    ${grids}${spokes}
    <polygon points="${dataPts}" fill="rgba(110,231,216,0.18)" stroke="#6EE7D8" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

// ------- 大型・共通レーダーチャート（配信スタイル） -------
function renderCommonRadar(commonObj){
  const axes = COMMON_RADAR_AXES;
  const n = axes.length;
  const r = 105, pad = 70, half = r + pad;
  const svgSize = half * 2;
  const maxVal = 5;

  function angleFor(i){ return (Math.PI*2*i/n) - Math.PI/2; }
  function point(i, val){
    const a = angleFor(i);
    const dist = (val/maxVal) * r;
    return [half + Math.cos(a)*dist, half + Math.sin(a)*dist];
  }
  function gridPoint(i, dist){
    const a = angleFor(i);
    return [half + Math.cos(a)*dist, half + Math.sin(a)*dist];
  }

  let grids = "";
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts = axes.map((_,i)=> gridPoint(i, r*f).join(',')).join(' ');
    grids += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
  });
  let spokes = "";
  axes.forEach((_,i)=>{
    const [x,y] = gridPoint(i, r);
    spokes += `<line x1="${half}" y1="${half}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
  });

  const vals = axes.map(a => (commonObj && commonObj[a.key] != null) ? commonObj[a.key] : 3);
  const dataPts = axes.map((a,i)=> point(i, vals[i]).join(',')).join(' ');

  let dots = "", labels = "";
  axes.forEach((a,i)=>{
    const [px,py] = point(i, vals[i]);
    dots += `<circle cx="${px}" cy="${py}" r="4.5" fill="#6EE7D8" style="filter:drop-shadow(0 0 5px #6EE7D8)"/>`;
    const [lx,ly] = gridPoint(i, r+38);
    labels += `<text x="${lx}" y="${ly}" fill="#F2F5FA" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="Noto Sans JP">${a.label}</text>`;
  });

  const srText = axes.map((a,i)=> `${a.label}${vals[i]}`).join('、');

  return `
    <div class="radar-common-wrap">
      <svg width="100%" viewBox="0 0 ${svgSize} ${svgSize}" style="overflow:visible" role="img" aria-label="配信スタイルチャート：${srText}">
        ${grids}${spokes}
        <polygon points="${dataPts}" fill="rgba(110,231,216,0.20)" stroke="#6EE7D8" stroke-width="2.5"/>
        ${dots}${labels}
      </svg>
    </div>
    <ul class="radar-legend">
      ${axes.map((a,i)=>`<li><span class="radar-legend-label">${a.label} ${vals[i]}</span><span class="radar-legend-range">${a.low} ←→ ${a.high}</span></li>`).join('')}
    </ul>
  `;
}

// ------- 相性診断：計算・画面 -------
function scoreForDiff(diff){
  const d = Math.round(Math.abs(diff));
  if (d<=0) return 100;
  if (d===1) return 80;
  if (d===2) return 60;
  if (d===3) return 40;
  return 20;
}
function computeMatch(creator){
  const cr = creator.common_radar || {};
  let total = 0, count = 0;
  COMMON_RADAR_AXES.forEach(a => {
    const userVal = state.diagnosisAnswers[a.key];
    const creatorVal = cr[a.key];
    if (userVal != null && creatorVal != null){
      total += scoreForDiff(userVal - creatorVal);
      count++;
    }
  });
  if (count === 0) return null;
  return Math.min(98, Math.round(total / count));
}
function hasAnyDiagnosisPreference(){
  return Object.values(state.diagnosisAnswers).some(v => v != null);
}
function describeAnswer(key, value){
  if (value == null) return null;
  const t = PREFERENCE_SUMMARY[key];
  if (value <= 2) return t.low;
  if (value >= 4) return t.high;
  return t.mid;
}
function buildPreferenceSummary(){
  return COMMON_RADAR_AXES
    .map(a => describeAnswer(a.key, state.diagnosisAnswers[a.key]))
    .filter(Boolean);
}
function reasonsFor(creator){
  const cr = creator.common_radar || {};
  const reasons = [];
  COMMON_RADAR_AXES.forEach(a => {
    const userVal = state.diagnosisAnswers[a.key];
    const creatorVal = cr[a.key];
    if (userVal == null || creatorVal == null) return;
    if (Math.abs(userVal - creatorVal) <= 1){
      if (creatorVal >= 4) reasons.push(REASON_TEMPLATES[a.key].high);
      else if (creatorVal <= 2) reasons.push(REASON_TEMPLATES[a.key].low);
    }
  });
  if (creator.is_live) reasons.push('現在配信中なので、すぐに見に行けます。');
  if (reasons.length === 0) reasons.push('あなたの好みに近い活動スタイルです。');
  return reasons.slice(0,3);
}

function viewDiagnosisResult(){
  const anyPref = hasAnyDiagnosisPreference();
  let scored = creators.map(c => ({ c, score: computeMatch(c) }));
  if (anyPref){
    scored = scored.sort((a,b) => (b.score ?? -1) - (a.score ?? -1));
  }
  const top3 = scored.slice(0,3);
  const rest = scored.slice(3,6);
  const summary = anyPref ? buildPreferenceSummary() : [];

  let prefBlock = "";
  if (!anyPref){
    prefBlock = '<p class="section-sub" style="margin:-6px 0 16px;">条件が指定されていないため、幅広い活動者を表示しています。</p>';

      + summary.map(function(s){ return "<li>" + s + "</li>"; }).join("")

  const top3Html = top3.map(function(o, i){ return renderResultCard(o.c, o.score, i); }).join("");

  return '<div class="section-label">Diagnosis Result</div><div class="section-title">✨ あなたに合う活動者</div>'

}

function formatScheduleTime(iso){
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
  const isTomorrow = d.toDateString() === tomorrow.toDateString();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const label = isToday ? '今日' : isTomorrow ? '明日' : `${d.getMonth()+1}/${d.getDate()}`;
  return `${label} ${hh}:${mm}〜`;
}

window.setRsvp = async function(scheduleId, choice){
  const s = streamSchedules.find(s => s.id === scheduleId);
  if (!s) return;
  const prevChoice = s.myChoice;
  const newChoice = prevChoice === choice ? null : choice;
  const deviceId = getDeviceId();

  if (sbClient){
    if (newChoice === null){
      const { error } = await sbClient.from('stream_rsvps').delete().eq('schedule_id', scheduleId).eq('device_id', deviceId);
      if (error){ console.error('[ハツミル] rsvp delete error', error); toast('通信エラーが発生しました'); return; }
    } else {
      const { error } = await sbClient.from('stream_rsvps').upsert(
        { schedule_id: scheduleId, device_id: deviceId, choice: newChoice },
        { onConflict: 'schedule_id,device_id' }
      );
      if (error){ console.error('[ハツミル] rsvp upsert error', error); toast('通信エラーが発生しました'); return; }
    }
  }

  if (prevChoice) s.counts[prevChoice] = Math.max(0, s.counts[prevChoice]-1);
  if (newChoice) s.counts[newChoice] = (s.counts[newChoice]||0) + 1;
  s.myChoice = newChoice;
  render();
}

    input.value = '';

  }
  formState.avatarFile = file;

window.submitStep1 = async function(){
  if (!formState.name.trim()){
    toast('活動名を入力してください');
    return;
  }

  let avatarUrl = formState.avatarUrl || null;
  if (formState.avatarFile){
    if (sbClient){
      try {
        const file = formState.avatarFile;
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
        const { error: upErr } = await sbClient.storage.from('avatars').upload(path, file);
        if (upErr) throw upErr;
        const { data: pub } = sbClient.storage.from('avatars').getPublicUrl(path);
        avatarUrl = pub.publicUrl;
      } catch(e){
        console.error('[ハツミル] avatar upload error', e);
        toast('画像のアップロードに失敗しましたが、登録は続けます');
        avatarUrl = null;
      }
    } else {
      avatarUrl = formState.avatarPreviewUrl;
    }
  }

  const payload = {
    name: formState.name,
    genre: formState.genre,
    phase: '準備中',
    main_tag: formState.mainTag || null,
    bio: null,
    sns_url: formState.sns || null,
    radar: {},
    common_radar: null,
    avatar_url: avatarUrl,
  };

  if (!sbClient){
    const newId = 'c' + (creators.length + 1) + '_' + Date.now();
    creators.unshift(Object.assign({ id: newId }, payload, { milestones: [] }));
    addMyCreatorId(newId);
    finishStep1(newId);
    return;
  }

  const { data, error } = await sbClient.from('creators').insert(payload).select().single();
  if (error){
    console.error('[ハツミル] creator insert error', error);
    toast('登録に失敗しました。時間をおいて試してください');
    return;
  }
  creators.unshift(Object.assign({}, data, { milestones: [] }));
  addMyCreatorId(data.id);
  finishStep1(data.id);
}
function finishStep1(newId){

window.submitRegistration = async function(){
  if (!formState.name.trim()){
    toast('お名前を入力してください');
    return;
  }
let avatarUrl = formState.avatarUrl || null;
  if (formState.avatarFile){
    if (sbClient){
      const file = formState.avatarFile;
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error: upErr } = await sbClient.storage.from('avatars').upload(path, file);
      if (upErr){
        console.error('[ハツミル] avatar upload error', upErr);
        toast('画像のアップロードに失敗しました');
        return;
      }
      const { data: pub } = sbClient.storage.from('avatars').getPublicUrl(path);
      avatarUrl = pub.publicUrl;
    } else {
      avatarUrl = formState.avatarPreviewUrl;
    }
  }

  const payload = {
    name: formState.name,
    genre: formState.genre,
    phase: formState.phase,
    bio: formState.bio || "はじめまして、よろしくお願いします。",
    sns_url: formState.sns || null,
    radar: {...formState.radar},
    common_radar: {...formState.commonRadar},
    avatar_url: avatarUrl,
  };

  if (state.editingId){
    // ---- 編集（更新）----
    const id = state.editingId;
    if (sbClient){
      const { data, error } = await sbClient.from('creators').update(payload).eq('id', id).select().single();
      if (error){
        console.error('[ハツミル] creator update error', error);
        toast('更新に失敗しました。時間をおいて試してください');
        return;
      }
      const idx = creators.findIndex(c => c.id === id);
      if (idx >= 0) creators[idx] = { ...creators[idx], ...data };
    } else {
      const idx = creators.findIndex(c => c.id === id);
      if (idx >= 0) creators[idx] = { ...creators[idx], ...payload };
    }
    toast('💾 変更を保存しました');
    state.editingId = null;
  } else {
    // ---- 新規登録 ----
    let newId;
    if (sbClient){
      const { data, error } = await sbClient.from('creators').insert(payload).select().single();
      if (error){
        console.error('[ハツミル] creator insert error', error);
        toast('登録に失敗しました。時間をおいて試してください');
        return;
      }
      newId = data.id;
      creators.unshift({ ...data, milestones: [] });
    } else {
      newId = 'c' + (creators.length + 1) + '_' + Date.now();
      creators.unshift({ id: newId, ...payload, milestones: [] });
    }
    addMyCreatorId(newId);
    toast('🌱 登録が完了しました！');
  }

  formState = { name:"", genre:"VTuber", phase:"準備中", bio:"", sns:"", radar: Object.fromEntries(GENRE_AXES["VTuber"].map(a=>[a,3])), commonRadar: { liveliness:3, commentInteraction:3, newcomerFriendliness:3, participationLevel:3, worldbuildingLevel:3 }, avatarFile:null, avatarPreviewUrl:null, avatarUrl:null };
  state.showRegisterForm = false;
  goTab('home');
  setTimeout(()=> openProfile(newId), 300);
}

// ------- プロフィールモーダル -------
function platformLabel(c){
  const url = c.sns_url || '';
  if (/youtube|youtu\.be/i.test(url)) return 'YouTube';
  if (/twitch/i.test(url)) return 'Twitch';
  if (/iriam/i.test(url)) return 'IRIAM';
  if (/twitter|x\.com/i.test(url)) return 'X（Twitter）';
  if (url) return 'その他';
  return '未設定';
}
window.openProfile = function(id, skipHistory){
  const c = creators.find(x=>x.id===id);
  if (!c) return;
  const overlay = document.getElementById('modalOverlay');
  const modal = document.getElementById('modalContent');
  const isSaved = state.saved.has(id);
  const hasDiagnosis = hasAnyDiagnosisPreference();
  const matchScore = hasDiagnosis ? computeMatch(c) : null;
  const reasons = hasDiagnosis ? reasonsFor(c) : [recommendReason(c)];

  modal.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-close" onclick="closeProfile()">✕</div>

    <div class="profile-header">
      ${avatarHtml(c,64)}
      <div>
        <div class="name">${c.name}</div>
        <div class="genre">${c.genre} ・ <span style="color:#6EE7D8">${c.phase}</span></div>
      </div>
    </div>

    ${matchScore != null ? `
      <div class="profile-match">
        <div class="profile-match-score">${matchScore}<span style="font-size:14px;">%</span></div>
        <div class="profile-match-label">あなたとの相性</div>
      </div>
    ` : ''}

    ${growthLine(c) ? `<div class="growth-line">${growthLine(c)}</div>` : ''}

    <div class="reason-box">
      ${reasons.map(r => `<div>💡 ${r}</div>`).join('')}
    </div>

    ${c.common_radar ? `
    <div class="section-label" style="margin-top:18px;">Style</div>
    <div class="section-title">配信スタイル</div>
    <p class="section-sub" style="margin:-6px 0 14px;">活動の優劣ではなく、この人の配信傾向を表しています。</p>
    ${renderCommonRadar(c.common_radar)}
    ` : ''}

    ${c.bio ? `<div class="bio">${c.bio}</div>` : ''}

    <div class="info-row">
      <div class="info-item"><span class="info-label">ジャンル</span><span class="info-value">${c.genre}</span></div>
      <div class="info-item"><span class="info-label">配信媒体</span><span class="info-value">${platformLabel(c)}</span></div>
      <div class="info-item"><span class="info-label">活動状況</span><span class="info-value">${c.phase}</span></div>
    </div>

    ${Object.keys(c.radar||{}).length > 0 ? `
    <div class="section-label" style="margin-top:20px;">My Points</div>
    <div class="section-title">✦ 私の推しポイント</div>
    <p class="section-sub" style="margin:-6px 0 10px;">共通チャートとは別に、本人が自由に選んだこだわりポイントです（相性診断には使用していません）。</p>
    <div class="radar-wrap">${renderRadar(c.radar)}</div>
    ` : ''}

    <div class="section-label" style="margin-top:20px;">Milestones</div>
    <div class="section-title">🌱 はじめて記録</div>
    <div class="timeline">
      ${c.milestones.map(m => `
        <div class="tl-item">
          <div class="tl-dot"></div>
          <div class="tl-content" style="flex:1">
            <div class="tl-title">${m.title}</div>
            <div class="tl-date">${m.date}</div>
            <div class="tl-desc">${m.desc}</div>
            <div class="cheer-row">${renderCheerRow(m,false)}</div>
            <div class="cheer-count">応援 ${cheerTotal(m)}件</div>
          </div>
        </div>
      `).join('')}
    </div>

    <button class="go-btn" onclick="goToStream('${c.name}', '${(c.sns_url||'').replace(/'/g,"\\'")}')">
      <span>✨ この人に会いに行く</span>
      <span class="go-sub">▶ 配信を見る</span>
    </button>
    <button class="save-btn" onclick="toggleSave('${c.id}')">${isSaved ? '💗 オキニ中（タップで解除）' : '🤍 オキニにする'}</button>
  `;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (!skipHistory){
    history.pushState({ profileId: id }, '', '#profile/' + id);
  }
}
window.closeProfile = function(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  if (location.hash.startsWith('#profile/')){
    history.pushState({}, '', location.pathname + location.search);
  }
}
window.addEventListener('popstate', function(){
  const hash = location.hash;
  if (hash.startsWith('#profile/')){
    const id = hash.slice('#profile/'.length);
    if (creators.find(c=>c.id===id)) openProfile(id, true);
  } else {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
});
window.goToStream = function(name, url){
  if (url){
    window.open(url, '_blank', 'noopener');
  } else {
    toast(`📺 ${name} さんの配信URLはまだ登録されていません`);
  }
}
window.toggleSave = function(id){
  if (state.saved.has(id)) { state.saved.delete(id); } else { state.saved.add(id); toast('💗 オキニに追加しました'); }
  saveOshiIds(state.saved);
  openProfile(id); // 再描画
}

// ------- ナビゲーション -------
window.goTab = function(tab){
  state.tab = tab;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.tab===tab));
  render();
}
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=> {
    if (el.dataset.tab === 'diagnosis') startDiagnosis();
    else goTab(el.dataset.tab);
  });
});
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if (e.target.id === 'modalOverlay') closeProfile();
});

function render(){
  const main = document.getElementById('mainView');
  if (state.tab === 'home') main.innerHTML = viewHome();
  else if (state.tab === 'search') main.innerHTML = viewSearch();
  else if (state.tab === 'diagnosis') main.innerHTML = viewDiagnosis();
  else if (state.tab === 'register') main.innerHTML = viewRegister();
  else if (state.tab === 'saved') main.innerHTML = viewSaved();
  else if (state.tab === 'mypage') main.innerHTML = viewMyPage();
}

function checkInitialHash(){
  const hash = location.hash;
  if (hash.startsWith('#profile/')){
    const id = hash.slice('#profile/'.length);
    if (creators.find(c=>c.id===id)) openProfile(id, true);
  }
}

render();
loadData().then(checkInitialHash);
</script>
</body>
</html>
